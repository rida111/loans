spring:
  application:
    name: "loans"

  config:
    import: "optional:configserver:http://localhost:8071/"
  #provide connection details of rabbitmq inside each ms:
#  rabbitmq:
#    host: "localhost"
#    port: 5672
#    username: "guest"
#    password: "guest"

  datasource:
    url: jdbc:mysql://localhost:3306/loans_db
    username: root
